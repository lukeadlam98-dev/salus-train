<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      No zooming.

      maximum-scale and user-scalable=no stop the pinch and the
      double-tap zoom. viewport-fit=cover lets the app paint under the
      notch and the home indicator, which is what the
      env(safe-area-inset-*) padding throughout the app assumes.

      Worth being honest about the trade: disabling zoom removes an
      accessibility affordance. It's defensible here because the type
      is large, the contrast is high, and the app respects the phone's
      own Display Zoom and Larger Text settings — but it is a real
      cost, not a free win.
    -->
    <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1,
               minimum-scale=1, user-scalable=no, viewport-fit=cover" />

    <meta name="theme-color" content="#F4F1EC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Salus Train" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Installable. On iOS this is not a nicety: push notifications
      only exist for an app on the home screen, so the manifest and
      the icon are load-bearing rather than polish.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <title>Salus Train</title>

    <!--
      The first paint.

      Without this the browser paints its own white page until the
      JavaScript has loaded and React has mounted — so opening the app
      went white, then flashed a logo, then faded in. Three stages
      where there should be one.

      Setting the background here and drawing the mark in plain HTML
      means the very first frame the phone paints is already the app.
      No white, no flash. The mark is up before a single byte of
      JavaScript has run.
    -->
    <style>
      html, body { margin: 0; background: #F4F1EC; }
      #boot {
        position: fixed; inset: 0; background: #F4F1EC;
        display: grid; place-items: center; z-index: 9999;
      }
      #boot svg { animation: bootIn .5s ease both; }
      /* Holds still, then breathes. A mark that starts pulsing
         immediately reads as a spinner; one that arrives and settles
         reads as the app opening. */
      @keyframes bootIn {
        from { opacity: 0; transform: scale(.92) }
        to   { opacity: 1; transform: scale(1) }
      }
      #boot.ready { opacity: 0; visibility: hidden;
        transition: opacity .4s ease, visibility .4s; }
    </style>
  </head>
  <body>
    <div id="boot">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="58" height="58"><defs><path id="su" d="M81.04 58.14 80.70 58.54 80.13 58.60 78.31 60.42 78.29 60.93 77.86 61.33 77.88 62.13 77.40 62.70 77.43 65.64 77.83 65.99 78.31 67.41 88.28 77.38 89.21 77.40 91.52 75.12 91.52 74.56 81.71 64.84 81.69 63.04 82.41 62.38 95.99 62.43 96.29 62.13 96.26 58.33 95.99 58.12Z"/><path id="si" d="M73.28 71.03 71.03 73.84 82.84 85.54 85.54 82.71Z"/></defs><g fill="#1A1613"><use href="#su" transform="rotate(-0.33 50 50)"/><use href="#si" transform="rotate(0.00 50 50)"/><use href="#su" transform="rotate(44.67 50 50)"/><use href="#si" transform="rotate(45.00 50 50)"/><use href="#su" transform="rotate(89.67 50 50)"/><use href="#si" transform="rotate(90.00 50 50)"/><use href="#su" transform="rotate(134.67 50 50)"/><use href="#si" transform="rotate(135.00 50 50)"/><use href="#su" transform="rotate(179.67 50 50)"/><use href="#si" transform="rotate(180.00 50 50)"/><use href="#su" transform="rotate(224.67 50 50)"/><use href="#si" transform="rotate(225.00 50 50)"/><use href="#su" transform="rotate(269.67 50 50)"/><use href="#si" transform="rotate(270.00 50 50)"/><use href="#su" transform="rotate(314.67 50 50)"/><use href="#si" transform="rotate(315.00 50 50)"/></g></svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
